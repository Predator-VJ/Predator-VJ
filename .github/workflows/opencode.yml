name: opencode
on:
  issue_comment:
    types: [created]
  pull_request_review_comment:
    types: [created]

jobs:
  opencode:
    if: |
      contains(github.event.comment.body, '/oc') ||
      contains(github.event.comment.body, '/opencode')
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Run OpenCode
        uses: anomalyco/opencode/github@latest
        with:
          # NOTE: "opencode/auto" is not a valid model. Pick any model from the
          # OpenCode Zen catalog (https://models.dev) such as:
          #   opencode/claude-sonnet-4-5, opencode/grok-code, opencode/gpt-5-codex
          model: opencode/grok-code
          share: true
